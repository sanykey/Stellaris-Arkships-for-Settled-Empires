l_russian:
 afse_waystation_observation_insight_gain: "От оседлых путевых станций"
 afse_logistic_drop_off_at_colony: "Доставка ресурсов на колонии"
 afse_logistic_drop_off_at_colony_automation_tt: "Доставлять собранные ресурсы на ближайшую собственную колонию."
 ap_afse_arkship_continuity: "Два пути, одна судьба"
 ap_afse_arkship_continuity_desc: "Наши миры могут стать опорой цивилизации, но не обязаны превращаться в её оковы. Традиции, промышленность и институты ковчегов продолжат существовать рядом с планетарным обществом."
 afse_arkship_continuity_effects: "Открывает оседлым империям технологии и строительство ковчегов и путевых станций. Сохраняет особые эффекты завершённых традиций и бонусов за стремление, предназначенные для ковчегов и кочевых империй. Оседлая империя может приказать ковчегу колонизировать планету, оставив останки ковчега с бонусами §G+60%§! к пригодности и §G+2§! к максимуму районов. Позволяет кочевым империям осесть, не отказываясь от остальных ковчегов."
 afse_requires_adaptability_or_versatility: "$TRIGGER_FAIL$Требуется завершить ветку традиций §Y«Адаптивность»§! или §Y«Универсальность»§!."
 afse_requires_arkship_continuity: "$TRIGGER_FAIL$Требуется бонус за стремление §Y$ap_afse_arkship_continuity$§!."
 afse_settle_keep_arkships: "Мы обретём здесь дом, но наши ковчеги продолжат путь."
 afse_settle_keep_arkships_tt: "\nВсе остальные §Yковчеги§! останутся под нашим непосредственным управлением."
 afse_settled_arkship_empire_size: "Оседлые ковчеги"
 afse_settled_arkship_empire_size_desc: "Ковчеги и их районы сохраняют повышенную административную нагрузку кочевых колоний."
 afse_settled_arkship_empire_size_breakdown: "Дополнительный размер империи: §Y+[Root.afse_settled_arkship_empire_size_total]§!\n$t$От §Y[Root.afse_settled_arkship_count]§! ковчегов: §Y+[Root.afse_settled_arkship_colony_empire_size_total]§!\n$t$От §Y[Root.afse_settled_arkship_district_count]§! районов ковчегов: §Y+[Root.afse_settled_arkship_district_empire_size_total]§!\n\nУчтены возвышение колоний и уменьшения размера империи от колоний и районов."
 afse_settled_waystation_megastructure: "$waystation_megastructure$"
 afse_settled_waystation_megastructure_DESC: "$waystation_megastructure_DESC$"
 afse_settled_waystation_megastructure_MEGASTRUCTURE_DETAILS: "$waystation_megastructure_MEGASTRUCTURE_DETAILS$"
 afse_requires_waystation_access: "$TRIGGER_FAIL$Для строительства путевой станции в пространстве другой оседлой империи требуются соглашение о путевых станциях и открытые границы."
 afse_settled_waystation_capacity: "Лимит путевых станций"
 afse_settled_waystation_capacity_desc: "Количество путевых станций, которое империя может содержать независимо от вместимости звёздных баз."
 afse_settled_waystation_capacity_breakdown: "Путевые станции: §Y[Root.afse_waystation_count]/[Root.afse_waystation_limit]§!\n$t$Базовый лимит: §G+[Root.afse_waystation_limit_base]§!\n$t$Путевые станции: §G+[Root.afse_waystation_limit_tech_1]§!\n$t$Мегаинженерия: §G+[Root.afse_waystation_limit_mega_engineering]§!\n$t$Улучшенная логистика путевых линий: §G+[Root.afse_waystation_limit_tech_2]§!\n$t$Продвинутая логистика путевых линий: §G+[Root.afse_waystation_limit_tech_3]§!\n$t$Звёздная экспансия: §G+[Root.afse_waystation_limit_stellar_expansion]§!\n$t$Предначертание судьбы: §G+[Root.afse_waystation_limit_manifest_destiny]§!\n$t$Покорение пустоты: §G+[Root.afse_waystation_limit_grasp_the_void]§!\n$t$Непреклонность: §G+[Root.afse_waystation_limit_unyielding_adopt]§!\n$t$Доктрина крепости: §G+[Root.afse_waystation_limit_fortress_doctrine]§!\n$t$Галактические амбиции: §G+[Root.afse_waystation_limit_galactic_ambition_percent]%§!"
 afse_waystation_limit_reached: "$TRIGGER_FAIL$Достигнут лимит путевых станций: §Y[From.afse_waystation_count]/[From.afse_waystation_limit]§!."
